apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karry-agent.fullname" . }}
  labels:
    {{- include "karry-agent.labels" . | nindent 4 }}
data:
  GEMINI_MODEL: {{ .Values.config.GEMINI_MODEL | quote }}
  KARRY_WORKSPACE: {{ .Values.config.KARRY_WORKSPACE | quote }}
  KARRY_PROGRESS_FILE: {{ .Values.config.KARRY_PROGRESS_FILE | quote }}
