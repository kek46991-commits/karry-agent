replicaCount: 1

image:
  repository: ghcr.io/your-org/karry-agent
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# Current karry-agent is a CLI worker. Override command/args when an API or queue adapter is added.
command: ["python3", "main.py"]
args: []

# Use an existing Secret in production; do not put API keys in values files.
existingSecret: ""
secretKey: GEMINI_API_KEY

config:
  GEMINI_MODEL: gemini-2.5-flash
  KARRY_WORKSPACE: /tmp/karry-agent
  KARRY_PROGRESS_FILE: /tmp/karry-agent/progress.md

env: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
