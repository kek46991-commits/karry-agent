<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>karry-agent | 自律型 AI エージェント</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a2d; --line:#263451; --text:#edf3ff; --muted:#91a0bd; --accent:#65a8ff; --good:#55d6a2; --warn:#ffc857; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 20% 0,#17264b 0,#0b1020 42%); color:var(--text); font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { width:min(1180px,100%); margin:auto; padding:28px 18px 48px; } header { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:22px; }
    .brand { display:flex; gap:12px; align-items:center; } .logo { width:42px;height:42px;display:grid;place-items:center;border:1px solid #4378c7;border-radius:13px;background:#172b53;color:#8fc3ff;font-weight:800;font-size:20px; }
    h1 { margin:0; font-size:22px; letter-spacing:.02em; } .subtitle { color:var(--muted); margin:2px 0 0; font-size:13px; }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; } .dot { width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good); }
    .grid { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; } .panel { background:rgba(18,26,45,.9); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 35px #0003; }
    .chat { min-height:650px; display:flex; flex-direction:column; } .messages { flex:1; padding:20px; overflow:auto; max-height:590px; }
    .message { max-width:88%; padding:12px 15px; border-radius:14px; margin:0 0 14px; white-space:pre-wrap; word-break:break-word; } .message.user { margin-left:auto;background:#1e477d; } .message.agent { background:#182238;border:1px solid #283858; }
    .message .label { display:block; color:#9ec9ff; font-size:11px; margin-bottom:4px; font-weight:700; } .empty { color:var(--muted); text-align:center; padding:120px 25px; }
    form { border-top:1px solid var(--line); padding:15px; display:flex; gap:10px; align-items:stretch; } textarea { flex:1; resize:vertical; min-height:52px; max-height:160px; border:1px solid #344766; border-radius:11px; padding:12px; background:#0c1426;color:var(--text);font:inherit; } button { border:0;border-radius:11px;padding:0 20px;background:var(--accent);color:#071326;font-weight:800;cursor:pointer; } button:disabled { opacity:.5;cursor:wait; } .icon-button { min-width:48px; padding:0 12px; background:#263c61;color:var(--text);font-size:18px; } .icon-button.active { background:#a34b67; } .voice-options { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin-top:8px; } .voice-options input { accent-color:var(--accent); }
    aside { padding:18px; } aside h2 { font-size:15px;margin:0 0 15px; } .metric { display:flex;justify-content:space-between;border-bottom:1px solid #202d47;padding:9px 0;color:var(--muted); } .metric strong { color:var(--text);font-variant-numeric:tabular-nums; }
    .trace { margin-top:22px; } .trace-list { max-height:280px; overflow:auto; } .event { border-left:2px solid var(--accent); padding:8px 10px;margin:9px 0;background:#0d1629;border-radius:0 8px 8px 0;font-size:12px; } .event .kind { color:var(--accent);font-weight:800; } .event pre { margin:4px 0 0;white-space:pre-wrap;color:#bdc9df; }
    .session { color:var(--muted); font-size:11px; word-break:break-all; margin-top:12px; } .hint { color:var(--muted);font-size:12px;margin-top:14px; } a { color:#8fc3ff; }
    @media (max-width:800px) { .grid{grid-template-columns:1fr;} .chat{min-height:560px;} aside{order:-1;} header{align-items:flex-start;flex-direction:column;} }
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><div class="logo">k</div><div><h1>karry-agent</h1><p class="subtitle">日本語 自律型 AI エージェント</p></div></div><div class="status"><span class="dot"></span><span id="status">オンライン</span></div></header>
    <section class="grid">
      <div class="panel chat"><div id="messages" class="messages"><div class="empty" id="empty">指示を入力すると、エージェントがツールを選択して実行します。<br>Thought → Action → Observation の流れを右側で確認できます。</div></div>
        <form id="chatForm"><textarea id="prompt" placeholder="例：現在時刻を確認してください" required></textarea><button id="mic" class="icon-button" type="button" title="音声入力" aria-label="音声入力">🎙</button><button id="send" type="submit">送信</button></form><div class="voice-options"><input id="autoSpeak" type="checkbox"><label for="autoSpeak">返答を自動で読み上げる</label><span id="voiceStatus">音声機能を確認中…</span></div>
      </div>
      <aside class="panel"><h2>実行モニター</h2><div class="metric"><span>ステップ</span><strong id="steps">—</strong></div><div class="metric"><span>ツール呼び出し</span><strong id="toolCalls">—</strong></div><div class="metric"><span>API 呼び出し</span><strong id="apiCalls">—</strong></div><div class="metric"><span>トークン</span><strong id="tokens">—</strong></div><div class="metric"><span>実行時間</span><strong id="elapsed">—</strong></div><div class="trace"><h2>実行トレース</h2><div id="trace" class="trace-list"><div class="hint">まだ実行されていません。</div></div></div><div class="session">Session: <span id="session">新規</span></div><p class="hint">API ドキュメントは <a href="/docs" target="_blank">/docs</a> で確認できます。</p></aside>
    </section>
    <label class="hint" for="apiToken">APIトークン（認証が有効な場合のみ・ブラウザに保存しません）</label>
    <input id="apiToken" type="password" autocomplete="off" aria-label="APIトークン" style="display:block;width:min(100%,420px);padding:10px;background:#0c1426;color:var(--text);border:1px solid var(--line);border-radius:8px">
  </main>
<script>
  const $ = id => document.getElementById(id);
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = SpeechRecognition ? new SpeechRecognition() : null;
  let speaking = false;
  if (recognition) { recognition.lang='ja-JP'; recognition.interimResults=true; recognition.continuous=false; recognition.onstart=()=>{ $('mic').classList.add('active'); $('voiceStatus').textContent='聞き取り中…'; }; recognition.onend=()=>{ $('mic').classList.remove('active'); $('voiceStatus').textContent='音声入力を利用できます'; }; recognition.onerror=event=>{ $('mic').classList.remove('active'); $('voiceStatus').textContent=`音声入力エラー: ${event.error}`; }; recognition.onresult=event=>{ const text=Array.from(event.results).map(result=>result[0].transcript).join(''); $('prompt').value=text; }; }
  else { $('mic').disabled=true; $('voiceStatus').textContent='このブラウザは音声入力に未対応です'; }
  function speak(text) { if (!('speechSynthesis' in window)) { $('voiceStatus').textContent='このブラウザは読み上げに未対応です'; return; } window.speechSynthesis.cancel(); const utterance=new SpeechSynthesisUtterance(text); utterance.lang='ja-JP'; utterance.rate=1; utterance.onstart=()=>{ speaking=true; $('voiceStatus').textContent='読み上げ中…'; }; utterance.onend=()=>{ speaking=false; $('voiceStatus').textContent='音声機能を利用できます'; }; window.speechSynthesis.speak(utterance); }
  function addSpeakButton(element, text) { if (!('speechSynthesis' in window)) return; const button=document.createElement('button'); button.className='icon-button'; button.type='button'; button.title='この返答を読み上げ'; button.textContent='🔊'; button.onclick=()=>speak(text); element.appendChild(button); }
  let sessionId = localStorage.getItem('karry-session') || null;
  if (sessionId) $('session').textContent = sessionId;
  function addMessage(kind, text) { $('empty')?.remove(); const el=document.createElement('div'); el.className=`message ${kind}`; el.innerHTML=`<span class="label">${kind==='user'?'あなた':'karry-agent'}</span>${escapeHtml(text)}`; $('messages').appendChild(el); if(kind==='agent') addSpeakButton(el,text); $('messages').scrollTop=$('messages').scrollHeight; return el; }
  function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function trace(kind, data) { const el=document.createElement('div'); el.className='event'; el.innerHTML=`<span class="kind">${escapeHtml(kind)}</span><pre>${escapeHtml(JSON.stringify(data,null,2))}</pre>`; $('trace').appendChild(el); $('trace').scrollTop=$('trace').scrollHeight; }
  function metrics(data) { const m=data.metrics||{}; $('steps').textContent=data.steps??'—'; $('toolCalls').textContent=data.tool_calls??'—'; $('apiCalls').textContent=m.api_calls??'—'; $('tokens').textContent=m.total_tokens??'—'; $('elapsed').textContent=m.elapsed_ms?`${Number(m.elapsed_ms).toFixed(0)} ms`:'—'; }
  $('mic').addEventListener('click',()=>{ if(recognition) { if($('mic').classList.contains('active')) recognition.stop(); else recognition.start(); } });
  $('chatForm').addEventListener('submit', async event => { event.preventDefault(); const prompt=$('prompt').value.trim(); if(!prompt)return; $('prompt').value=''; $('send').disabled=true; $('status').textContent='実行中…'; addMessage('user',prompt); trace('started',{prompt});
    try { const headers={'content-type':'application/json'}; const token=$('apiToken').value; if(token) headers.Authorization=`Bearer ${token}`; const response=await fetch('/chat',{method:'POST',headers,body:JSON.stringify({prompt,session_id:sessionId,stream:true})}); if(!response.ok) throw new Error(await response.text()); const reader=response.body.getReader(), decoder=new TextDecoder(); let buffer=''; let completed=null;
      while(true){ const {value,done}=await reader.read(); if(done)break; buffer+=decoder.decode(value,{stream:true}); const chunks=buffer.split('\n\n'); buffer=chunks.pop(); for(const chunk of chunks){ const event=(chunk.match(/^event: (.*)$/m)||[])[1]; const raw=(chunk.match(/^data: (.*)$/m)||[])[1]; if(!raw)continue; const data=JSON.parse(raw); trace(event,data); if(event==='completed')completed=data; if(event==='error')throw new Error(data.detail||'実行に失敗しました'); } }
      if(completed){ sessionId=completed.session_id; if(sessionId){localStorage.setItem('karry-session',sessionId);$('session').textContent=sessionId;} addMessage('agent',completed.text); metrics(completed); if($('autoSpeak').checked) speak(completed.text); }
      $('status').textContent='オンライン';
    } catch(error){ addMessage('agent',`エラー: ${error.message}`); $('status').textContent='エラー'; } finally { $('send').disabled=false; $('prompt').focus(); }
  });
</script>
</body>
</html>
