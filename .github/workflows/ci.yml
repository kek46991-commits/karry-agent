name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: karry_media_test
          POSTGRES_PASSWORD: ci-only-placeholder
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Ephemeral CI database only; never a production DSN.
      KARRY_TEST_DATABASE_URL: postgresql://postgres:ci-only-placeholder@localhost:5432/karry_media_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[test]'
      - name: Set up Node for Drizzle and UI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and migrate isolated PostgreSQL twice
        run: |
          npm run db:typecheck
          DATABASE_URL="$KARRY_TEST_DATABASE_URL" npm run db:migrate
          DATABASE_URL="$KARRY_TEST_DATABASE_URL" npm run db:migrate
      - name: Run unit and database integration tests
        run: python -m pytest -q
      - name: Run task chat UI tests
        run: npm run test:ui
