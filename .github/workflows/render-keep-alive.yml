name: Keep Render demo warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping karry-agent-1 health endpoint
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --max-time 30 \
            https://karry-agent-1.onrender.com/health
          echo "Render health check passed"
