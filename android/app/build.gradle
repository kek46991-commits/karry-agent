plugins { id "com.android.application" }

def legacyServerUrl = (project.findProperty("karryServerUrl") ?: "https://karry-agent-1.onrender.com").toString()
def monitorServerUrl = (project.findProperty("karryMonitorUrl") ?: legacyServerUrl).toString()
def workerServerUrl = (project.findProperty("karryWorkerUrl") ?: legacyServerUrl).toString()

android {
    namespace "com.karry.device"
    compileSdk 36
    defaultConfig {
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }
    buildFeatures { buildConfig true }
    flavorDimensions "role"
    productFlavors {
        monitor {
            dimension "role"
            applicationId "com.karry.device.monitor"
            buildConfigField "String", "SERVER_URL", "\"${monitorServerUrl}\""
            buildConfigField "String", "START_PATH", "\"/monitor\""
            buildConfigField "boolean", "WORKER", "false"
            manifestPlaceholders = [cleartext: monitorServerUrl.startsWith("http://").toString()]
        }
        worker {
            dimension "role"
            applicationId "com.karry.device.worker"
            buildConfigField "String", "SERVER_URL", "\"${workerServerUrl}\""
            buildConfigField "String", "START_PATH", "\"/companion\""
            buildConfigField "boolean", "WORKER", "true"
            manifestPlaceholders = [cleartext: workerServerUrl.startsWith("http://").toString()]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
