[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karry-agent"
version = "0.1.0"
description = "Gemini-powered autonomous agent core with function calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.30.0,<2",
  "python-dotenv>=1.0.0,<2",
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "google-api-python-client>=2.140.0,<3",
  "google-auth-httplib2>=0.2.0,<1",
  "google-auth-oauthlib>=1.2.0,<2",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "urllib3>=2.2,<3",
  "boto3>=1.40,<2",
  "Pillow>=11.3,<13",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]

[project.scripts]
karry-agent = "karry_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
karry_agent = ["jimmy_core_memory.json"]
