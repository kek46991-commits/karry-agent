services:
  - type: web
    name: karry-agent
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install .
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_PASSPHRASE
        sync: false
      - key: GOOGLE_CALENDAR_TOKEN_JSON
        sync: false
      - key: GOOGLE_CALENDAR_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PHOTOS_TOKEN_JSON
        sync: false
      - key: GOOGLE_WORKSPACE_TOKEN_JSON
        sync: false
      - key: KARRY_API_TOKEN
        sync: false
      - key: KARRY_ALLOW_SHELL
        value: "0"
      - key: GOOGLE_CALENDAR_TOKEN_FILE
        value: /tmp/karry-agent/token.json
      - key: GOOGLE_CALENDAR_CREDENTIALS_FILE
        value: /tmp/karry-agent/credentials.json
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: KARRY_WORKSPACE
        value: /tmp/karry-agent
      - key: KARRY_WEBSITE_STORAGE
        value: s3
      - key: KARRY_WEBSITE_S3_PREFIX
        value: karry-websites/
      - key: KARRY_WEBSITE_S3_BUCKET
        sync: false
      - key: KARRY_WEBSITE_S3_ENDPOINT
        sync: false
      - key: KARRY_WEBSITE_S3_REGION
        sync: false
      - key: KARRY_WEBSITE_S3_ACCESS_KEY_ID
        sync: false
      - key: KARRY_WEBSITE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: KARRY_TASK_STORAGE
        value: s3
      - key: KARRY_TASK_S3_PREFIX
        value: karry-tasks/
      - key: DATABASE_URL
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: KARRY_MEDIA_GENERATION_ENABLED
        value: "0"
