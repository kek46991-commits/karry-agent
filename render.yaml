services:
  - type: web
    name: karry-agent
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install .
    startCommand: python -m karry_agent.location_history --migrate && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_PASSPHRASE
        sync: false
      - key: GOOGLE_CALENDAR_TOKEN_JSON
        sync: false
      - key: GOOGLE_CALENDAR_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PHOTOS_TOKEN_JSON
        sync: false
      - key: GOOGLE_WORKSPACE_TOKEN_JSON
        sync: false
      - key: KARRY_API_TOKEN
        sync: false
      - key: KARRY_LOGIN_ACCOUNTS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: KARRY_GOOGLE_TOKEN_KEY
        sync: false
      - key: KARRY_ALLOW_SHELL
        value: "0"
      - key: KARRY_OPTIMUS_GITHUB_TOKEN
        sync: false
      - key: KARRY_OPTIMUS_GITHUB_REPO
        value: kek46991-commits/karry-agent
      - key: KARRY_OPTIMUS_AUTO_MERGE
        sync: false
      - key: KARRY_GIT_GITHUB_TOKEN
        sync: false
      - key: KARRY_GIT_ALLOWED_REPOS
        value: kek46991-commits/karry-agent
      - key: KARRY_GIT_AUTO_MERGE
        sync: false
      - key: GOOGLE_CALENDAR_TOKEN_FILE
        value: /tmp/karry-agent/token.json
      - key: GOOGLE_CALENDAR_CREDENTIALS_FILE
        value: /tmp/karry-agent/credentials.json
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: KARRY_WORKSPACE
        value: /tmp/karry-agent
      - key: KARRY_WEBSITE_STORAGE
        value: s3
      - key: KARRY_WEBSITE_S3_PREFIX
        value: karry-websites/
      - key: KARRY_WEBSITE_S3_BUCKET
        sync: false
      - key: KARRY_WEBSITE_S3_ENDPOINT
        sync: false
      - key: KARRY_WEBSITE_S3_REGION
        sync: false
      - key: KARRY_WEBSITE_S3_ACCESS_KEY_ID
        sync: false
      - key: KARRY_WEBSITE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: KARRY_TASK_STORAGE
        value: s3
      - key: KARRY_TASK_S3_PREFIX
        value: karry-tasks/
      - key: KARRY_KNOWLEDGE_GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: KARRY_MEDIA_GENERATION_ENABLED
        value: "0"
  - type: web
    name: karry-monitor
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn device_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - device_app.py
        - requirements.txt
        - static/device-common.*
        - static/device-sw.js
        - static/monitor.html
        - static/monitor.webmanifest
        - static/icons/**
        - render.yaml
    envVars:
      - key: KARRY_DEVICE_ROLE
        value: monitor
      - key: KARRY_BACKEND_URL
        value: https://karry-agent-1.onrender.com
  - type: web
    name: karry-worker
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn device_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      paths:
        - device_app.py
        - requirements.txt
        - static/device-common.*
        - static/device-sw.js
        - static/companion.html
        - static/companion.webmanifest
        - static/icons/**
        - render.yaml
    envVars:
      - key: KARRY_DEVICE_ROLE
        value: worker
      - key: KARRY_BACKEND_URL
        value: https://karry-agent-1.onrender.com
